# RAUC system configuration for the Luckfox Lyra PLC.
[system]
compatible=luckfox-lyra-plc
bootloader=uboot
# Only signed, dm-verity protected bundles.
bundle-formats=-plain
# Persistent RAUC state (slot status) on the data partition.
data-directory=/data/rauc

[keyring]
path=ca.cert.pem
# Signing certificates carry extendedKeyUsage=codeSigning.
check-purpose=codesign

# Each slot is a whole root filesystem including /boot (kernel + dtb).
# resize=true grows the ext4 image RAUC writes to fill the 1.5 GiB partition.
[slot.rootfs.0]
device=/dev/mmcblk0p2
type=ext4
bootname=A
resize=true

[slot.rootfs.1]
device=/dev/mmcblk0p3
type=ext4
bootname=B
resize=true
