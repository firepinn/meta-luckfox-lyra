# RAUC A/B: the bootchooser state (BOOT_ORDER, BOOT_x_LEFT) lives in a
# redundant U-Boot environment on the eMMC, shared with Linux fw_setenv
# (/etc/fw_env.config must match these offsets). 14 MiB sits between the end of
# u-boot-rockchip.bin (< 9.1 MiB from 32 KiB) and the first partition (16 MiB).
# CONFIG_ENV_IS_NOWHERE is not set
CONFIG_ENV_IS_IN_MMC=y
CONFIG_ENV_SIZE=0x20000
CONFIG_ENV_OFFSET=0xe00000
CONFIG_ENV_REDUNDANT=y
CONFIG_ENV_OFFSET_REDUND=0xe20000
# The bootchooser script decrements BOOT_x_LEFT.
CONFIG_CMD_SETEXPR=y
