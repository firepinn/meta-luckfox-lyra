# meta-luckfox-lyra — BSP layer for Luckfox Lyra Pi (Rockchip RK3506B)
#
# Provides:
#   - Machine configs: luckfox-lyra-pi-a (eMMC), luckfox-lyra-pi-b (microSD)
#   - Mainline-based U-Boot 2026.04 (rk3506 SoC support) + rkbin DDR/TEE blobs
#   - Rockchip vendor 6.1 kernel with the Luckfox Lyra Pi device trees
#   - WIC layout, image recipe, root/root OpenSSH access

BBPATH .= ":${LAYERDIR}"

BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "luckfox-lyra"
BBFILE_PATTERN_luckfox-lyra = "^${LAYERDIR}/"
BBFILE_PRIORITY_luckfox-lyra = "10"

# Real dependencies, so bitbake complains up front instead of failing with a
# confusing missing-recipe error:
#   openembedded-layer  can-utils, libgpiod, spitools, evtest, devmem2, htop
#   arm-toolchain       gcc-arm-none-eabi-native, for the Cortex-M0 firmware
#
# Deliberately NOT depending on meta-networking or meta-python. The only thing
# ever wanted from either was phytool, for debugging the PHY, and the in-kernel
# CH182H driver made that unnecessary. Dropping them also removes a `world`
# build failure that yocto-check-layer trips over: meta-networking's
# system-config-printer RDEPENDS on gtk+3, which is unbuildable once x11 and
# wayland are out of DISTRO_FEATURES -- and they must be, RK3506B has no GPU.
LAYERDEPENDS_luckfox-lyra = "core openembedded-layer arm-toolchain"
# Ported to Yocto 6.0 "wrynose" (GCC 15, glibc 2.43); the scarthgap version of
# this layer lives in ../lyra-pi. The two are not interchangeable: wrynose
# recipes use UNPACKDIR and keep their WKS files under files/wic/.
LAYERSERIES_COMPAT_luckfox-lyra = "wrynose"

