#@TYPE: Machine
#@NAME: Luckfox Lyra Pi B
#@SOC: Rockchip RK3506B
#@DESCRIPTION: Luckfox Lyra Pi Model B / B-W — as Model A but booting from the
#              microSD slot instead of eMMC. RK3506 has a single SDMMC
#              controller, so only one of the two can be populated.

require conf/machine/include/luckfox-rk3506.inc

MACHINE_FEATURES += "sdio wifi bluetooth"

# See the Model A conf: the -w DTB is a superset and covers both B and B-W.
KERNEL_DEVICETREE = " \
    rockchip/rk3506b-luckfox-lyra-pi-w-sd.dtb \
    rockchip/rk3506b-luckfox-lyra-pi-sd.dtb \
"
LUCKFOX_DTB = "rk3506b-luckfox-lyra-pi-w-sd.dtb"
LUCKFOX_DTB_ALL = "rk3506b-luckfox-lyra-pi-w-sd.dtb rk3506b-luckfox-lyra-pi-sd.dtb"
