#@TYPE: Machine
#@NAME: Luckfox Lyra PLC
#@SOC: Rockchip RK3506B
#@DESCRIPTION: Luckfox Lyra PLC — RK3506B (3x Cortex-A7), 512 MB DDR3L,
#              8 GB eMMC, dual 10/100 RMII Ethernet (CH182H), RS232 +
#              RS485/RS422 + CAN on screw terminals, two 10 A relays,
#              1.9" 170x320 ST7789V LCD with CST816 touch, PCF8563-class RTC,
#              SHTC3 temperature/humidity, AIC8800DC WiFi 6 / BT 5.2 behind a
#              CH334 USB hub, USB-C OTG and one USB-A host port.

require conf/machine/include/luckfox-rk3506.inc

MACHINE_FEATURES += "emmc wifi bluetooth screen touchscreen"

KERNEL_DEVICETREE = "rockchip/rk3506b-luckfox-lyra-plc.dtb"
LUCKFOX_DTB = "rk3506b-luckfox-lyra-plc.dtb"
LUCKFOX_DTB_ALL = "rk3506b-luckfox-lyra-plc.dtb"

# U-Boot keeps the Lyra Pi device tree and defconfig: it only needs DDR,
# the eMMC on the SDMMC controller and UART0 on gpio0 C6/C7, which the PLC
# wires exactly like the Lyra Pi. The board DT that matters is the kernel's,
# selected by extlinux above.

# The Lyra Pi's M0 demo firmware drives a pin that is the LCD's D/C line on the
# PLC, so the Lyra Pi M0 packagegroup stays out and the M0 node is disabled in
# the device tree; packagegroup-luckfox-lyra-plc pulls in the remoteproc driver
# for firmware that enables it.
LUCKFOX_HAS_M0 = "0"

# LVGL 9.6 (recipes-graphics/lvgl), not meta-oe's 9.1: software rotation in
# the fbdev driver and the faster software renderer.
PREFERRED_VERSION_lvgl = "9.6.0"

# --- RAUC A/B ---------------------------------------------------------------
# U-Boot runs boot.scr (lyra-plc-bootscript) from the small boot partition; it
# picks slot A or B and loads that slot's own /boot/zImage and device tree, so
# a RAUC update replaces kernel, dtb and rootfs together. See
# files/wic/luckfox-lyra-plc-rauc.wks and docs/LYRA-PLC.md.
WKS_FILE = "luckfox-lyra-plc-rauc.wks"
IMAGE_BOOT_FILES = "boot.scr"
IMAGE_FSTYPES = "wic wic.bmap ext4"
do_image_wic[depends] += "lyra-plc-bootscript:do_deploy"
