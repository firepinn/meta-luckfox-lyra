#@TYPE: Machine
#@NAME: Luckfox Lyra Pi A
#@SOC: Rockchip RK3506B
#@DESCRIPTION: Luckfox Lyra Pi Model A / A-W — RK3506B (3x Cortex-A7 +
#              Cortex-M0), 512 MB DDR3L, 8 GB eMMC (no microSD slot),
#              dual 10/100 RMII Ethernet, USB-C OTG + 2x USB-A via CH334F hub,
#              ES8311 codec on the 3.5mm jack, 2-lane MIPI DSI, 40-pin header,
#              M.2 slot for 4G LTE, and optional AIC8800DC WiFi 6 / BT 5.2.

require conf/machine/include/luckfox-rk3506.inc

MACHINE_FEATURES += "emmc wifi bluetooth"

# Boots the -w device tree, which is a strict superset of the plain one: it
# only adds the wireless_bluetooth node driving the module's BT power GPIO
# (gpio1_PC5, unused otherwise). That is inert on a non-W board, so a single
# image covers both Model A and Model A-W. The plain DTB is also shipped in
# /boot if you would rather point extlinux at it.
KERNEL_DEVICETREE = " \
    rockchip/rk3506b-luckfox-lyra-pi-w.dtb \
    rockchip/rk3506b-luckfox-lyra-pi.dtb \
"
LUCKFOX_DTB = "rk3506b-luckfox-lyra-pi-w.dtb"
LUCKFOX_DTB_ALL = "rk3506b-luckfox-lyra-pi-w.dtb rk3506b-luckfox-lyra-pi.dtb"
