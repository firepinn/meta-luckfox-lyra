# Luckfox Lyra PLC peripherals on top of the Lyra Pi config.

# 1.9" ST7789V LCD via the generic MIPI DBI panel driver, with /dev/fb0 for
# fbdev users (LVGL's fbdev backend, fbcon). A module on purpose: it loads its
# init sequence with request_firmware() in probe, which only finds
# /lib/firmware once the rootfs is mounted.
CONFIG_DRM_PANEL_MIPI_DBI=m
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_FRAMEBUFFER_CONSOLE=y
CONFIG_BACKLIGHT_PWM=y
CONFIG_SPI_ROCKCHIP=y

# CPU rail is a PWM buck.
CONFIG_REGULATOR_PWM=y

# I2C2: TCS8563 (PCF8563 clone) RTC and SHTC3 temperature/humidity.
CONFIG_RTC_DRV_PCF8563=y
CONFIG_SENSORS_SHTC1=y
CONFIG_HWMON=y

# CAN-FD controller.
CONFIG_CAN=y
CONFIG_CAN_DEV=y
CONFIG_CAN_RAW=y
CONFIG_CANFD_RK3576=y

# RS485 direction through an RTS gpio (8250 selects SERIAL_MCTRL_GPIO).
CONFIG_SERIAL_8250_DW=y

# Relays and named lines through the character device.
CONFIG_GPIO_CDEV=y

# USB-C (otg0) as a device port. The shared config builds DWC2 host-only, so
# dr_mode = "peripheral" had no gadget side to bind to. Dual-role keeps otg1
# (hub, WiFi, USB-A) in host mode via its own dr_mode.
CONFIG_USB_DWC2_DUAL_ROLE=y
CONFIG_USB_GADGET=y
CONFIG_USB_LIBCOMPOSITE=y
CONFIG_USB_CONFIGFS=y
CONFIG_USB_CONFIGFS_NCM=y

# RAUC verity bundles: squashfs payload, loop mount, dm-verity.
CONFIG_BLK_DEV_LOOP=y
CONFIG_MD=y
CONFIG_BLK_DEV_DM=y
CONFIG_DM_VERITY=y
CONFIG_SQUASHFS=y
CONFIG_SQUASHFS_ZLIB=y
CONFIG_SQUASHFS_XZ=y
CONFIG_SQUASHFS_ZSTD=y
