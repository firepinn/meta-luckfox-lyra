# Luckfox Lyra Pi peripheral coverage.
#
# The vendor defconfig ships several of these as modules (or omits symbols
# that default to y in Rockchip's Kconfig). Networking and storage are forced
# built-in so the board comes up fully without depending on module load
# ordering, and the rest are turned on explicitly so the DT nodes actually
# get a driver bound.

# --- Ethernet (dual RMII GMAC) ---
CONFIG_STMMAC_ETH=y
CONFIG_STMMAC_PLATFORM=y
CONFIG_DWMAC_ROCKCHIP=y
CONFIG_PHYLIB=y
CONFIG_MOTORCOMM_PHY=y
CONFIG_ICPLUS_PHY=y
CONFIG_REALTEK_PHY=y
CONFIG_MICREL_PHY=y
CONFIG_SMSC_PHY=y
CONFIG_DAVICOM_PHY=y

# --- USB: USB-C OTG (otg0) + USB-A host behind the CH334F hub (otg1) ---
CONFIG_USB=y
CONFIG_USB_DWC2=y
CONFIG_USB_DWC2_DUAL_ROLE=y
CONFIG_PHY_ROCKCHIP_INNO_USB2=y
CONFIG_USB_STORAGE=y
CONFIG_USB_HID=y
CONFIG_USB_ACM=y
CONFIG_USB_SERIAL=y

# --- Storage: eMMC / microSD share the single SDMMC controller ---
CONFIG_MMC=y
CONFIG_MMC_BLOCK=y
CONFIG_MMC_DW=y
CONFIG_MMC_DW_ROCKCHIP=y
CONFIG_EXT4_FS=y
CONFIG_EXT4_USE_FOR_EXT2=y
CONFIG_VFAT_FS=y
CONFIG_NLS_CODEPAGE_437=y
CONFIG_NLS_ISO8859_1=y

# --- Audio: ES8311 codec on the 3.5mm jack via SAI1/I2C2 ---
CONFIG_SOUND=y
CONFIG_SND=y
CONFIG_SND_SOC=y
CONFIG_SND_SOC_ES8311=y
CONFIG_SND_SIMPLE_CARD=y
CONFIG_SND_SOC_ROCKCHIP=y

# --- CAN bus ---
CONFIG_CAN=y
CONFIG_CAN_RAW=y
CONFIG_CAN_BCM=y
CONFIG_CAN_DEV=y
CONFIG_CANFD_ROCKCHIP=y

# --- 40-pin header: I2C / SPI / PWM / ADC / GPIO ---
CONFIG_I2C=y
CONFIG_I2C_CHARDEV=y
CONFIG_I2C_RK3X=y
CONFIG_SPI=y
CONFIG_SPI_SPIDEV=y
CONFIG_SPI_ROCKCHIP=y
CONFIG_PWM=y
CONFIG_PWM_ROCKCHIP=y
CONFIG_ROCKCHIP_SARADC=y
CONFIG_GPIO_SYSFS=y
CONFIG_GPIO_CDEV=y
CONFIG_GPIO_CDEV_V1=y

# --- Thermal / watchdog / RTC ---
CONFIG_ROCKCHIP_THERMAL=y
CONFIG_WATCHDOG=y
CONFIG_DW_WATCHDOG=y
CONFIG_RTC_CLASS=y
CONFIG_RTC_DRV_PCF8563=y
CONFIG_RTC_DRV_HYM8563=y

# --- M.2 4G LTE modem (USB-attached: SIM7600G-H) ---
CONFIG_USB_NET_QMI_WWAN=y
CONFIG_USB_SERIAL_OPTION=y
CONFIG_USB_SERIAL_QUALCOMM=y
CONFIG_USB_USBNET=y
CONFIG_PPP=y
CONFIG_PPP_ASYNC=y

# --- Display: 2-lane MIPI DSI ---
CONFIG_DRM=y
CONFIG_DRM_ROCKCHIP=y
CONFIG_ROCKCHIP_VOP=y
CONFIG_ROCKCHIP_DW_MIPI_DSI=y
CONFIG_PHY_ROCKCHIP_INNO_DSIDPHY=y
CONFIG_DRM_PANEL_SIMPLE=y
CONFIG_DRM_FBDEV_EMULATION=y

# --- Networking bits needed for SSH + DHCP on both NICs ---
CONFIG_IPV6=y
CONFIG_PACKET=y
CONFIG_UNIX=y
CONFIG_INET=y

# --- OP-TEE (the boot chain loads rkbin OP-TEE; expose /dev/tee*) ---
CONFIG_TEE=y
CONFIG_OPTEE=y
