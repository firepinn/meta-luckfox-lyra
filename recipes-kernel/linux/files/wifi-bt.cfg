# WiFi / Bluetooth support for the Luckfox Lyra Pi W variants.
#
# The radio is an AIC8800DC, USB-attached behind the on-board CH334F hub
# (a69c:88dc) — RK3506 has no SDIO peripheral. The WiFi side comes from the
# out-of-tree aic8800dc-wifi-bt modules; Bluetooth is served by the in-kernel
# btusb driver, so no vendor BT module is needed.
#
# Harmless on non-W boards: with no module fitted nothing binds.

# --- 802.11 core ---
CONFIG_CFG80211=y
CONFIG_CFG80211_WEXT=y
CONFIG_MAC80211=y
CONFIG_WLAN=y
CONFIG_WIRELESS=y
CONFIG_RFKILL=y
CONFIG_RFKILL_INPUT=y

# Rockchip's rfkill-bt driver backs the DTS "bluetooth-platdata" node, which
# drives the module's BT power GPIO (gpio1_PC5 on the Lyra Pi W).
CONFIG_RFKILL_RK=y

# --- Bluetooth ---
CONFIG_BT=y
CONFIG_BT_BREDR=y
CONFIG_BT_LE=y
CONFIG_BT_RFCOMM=y
CONFIG_BT_RFCOMM_TTY=y
CONFIG_BT_BNEP=y
CONFIG_BT_HIDP=y
CONFIG_BT_HCIBTUSB=y
CONFIG_BT_HCIUART=y
CONFIG_BT_HCIUART_H4=y

# --- crypto required by WPA2/WPA3 and BLE pairing ---
CONFIG_CRYPTO_ECC=y
CONFIG_CRYPTO_ECDH=y
CONFIG_CRYPTO_ECDSA=y
CONFIG_CRYPTO_HMAC=y
CONFIG_CRYPTO_SHA256=y
CONFIG_CRYPTO_SHA512=y
CONFIG_CRYPTO_CMAC=y
CONFIG_CRYPTO_CCM=y
CONFIG_CRYPTO_GCM=y
CONFIG_CRYPTO_LIB_ARC4=y
CONFIG_CRYPTO_USER_API_HASH=y
CONFIG_CRYPTO_USER_API_SKCIPHER=y

# --- needed so the out-of-tree module can be loaded ---
CONFIG_MODULES=y
CONFIG_MODULE_UNLOAD=y
